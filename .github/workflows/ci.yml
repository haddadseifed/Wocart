name: CI

on:
  workflow_dispatch:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  server:
    name: cod-server (typecheck + test + build)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: package-lock.json
      - run: npm ci
      - run: npm run typecheck --workspace codflow-server
      - run: npm test --workspace codflow-server
      - run: cp wrangler.toml.example wrangler.toml
        working-directory: cod-server
      - run: npm run build:ci --workspace codflow-server

  dashboard:
    name: cod-client-astro (typecheck + test + build)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: package-lock.json
      - run: npm ci
      - run: npm run typecheck --workspace codflow-client-astro
      - run: npm run build --workspace codflow-client-astro
        env:
          PUBLIC_API_URL: http://localhost:8787
      - run: npm test --workspace codflow-client-astro
        env:
          PUBLIC_API_URL: http://localhost:8787

  theme-00:
    name: Theme-00 against the published SDKs (test + astro check + build)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: cod-astro/theme-00
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: cod-astro/theme-00/package-lock.json
      - run: npm ci
      - run: npm test
      - run: npx astro check
      - run: npm run build
